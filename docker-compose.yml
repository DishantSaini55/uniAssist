# docker compose up --build   ->  API :8000 (docs at /docs), UI :5173
# Vectors (ChromaDB, persisted to disk), SQLite, audit log and uploaded originals live in ./runtime,
# so restarting never re-ingests. Ollama runs on the host (see README); LLM_MODE=mock needs no model.
services:
  backend:
    image: dishantsaini55/uniassist-backend:latest
    build: .
    ports: ["8000:8000"]
    environment:
      LLM_MODE: ${LLM_MODE:-mock}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1:8b}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./runtime:/app/runtime"]
  frontend:
    image: dishantsaini55/uniassist-frontend:latest
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
